<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffeine Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <h1>Caffeine Calculator</h1>
        <p id="clock">Current time: loading</p>
        <p>Enter caffeine amount in mg</p>
        <input type="text" id="caffeine-input" placeholder="mg">
        <button id="action-btn">Calculate</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
