<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffeine Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-container">
    <h1>Caffeine Calculator</h1>
    <p id="clock">Current time: loading</p>
    <p>Enter caffeine amount in mg</p>
    <input type="text" id="caffeine-input" placeholder="mg">
    <button id="action-btn">Calculate</button>

    <p id="summary"></p>
    <canvas id="chart"></canvas>
</main>
<script src="script.js"></script>
</body>
</html>
